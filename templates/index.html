        /** 把 pending_action 渲染成对话流中的确认卡片 */
        function renderConfirmCard(action) {
            if (!action || !action.type) return;
            const chatContainer = document.getElementById('chatContainer');
            const card = document.createElement('div');
            card.className = 'confirm-card';

            if (action.type === 'book_flight') {
                card.innerHTML =
                    '<div class="confirm-card-title">🛫 订票确认</div>'
                    + '<div class="confirm-card-body">正在获取实时报价…</div>'
                    + '<div class="confirm-card-actions">'
                    + '<button type="button" class="confirm-btn confirm-btn--primary" data-act="ok">确认预订</button>'
                    + '<button type="button" class="confirm-btn" data-act="cancel">取消</button>'
                    + '</div>';
                chatContainer.appendChild(card);
                fillBookingCard(card, action);
                card.querySelector('[data-act="ok"]').onclick = function () { confirmBooking(card, action); };
                card.querySelector('[data-act="cancel"]').onclick = function () { cancelConfirmCard(card, '已取消本次订票。'); };
            } else if (action.type === 'refund') {
                const isSpecial = (action.refund_type === 'special');
                card.innerHTML =
                    '<div class="confirm-card-title">↩️ 退票确认' + (isSpecial ? '（特殊通道）' : '') + '</div>'
                    + '<div class="confirm-card-body">订单号：<b>' + escHtml(action.order_no || '-') + '</b>'
                    + (action.reason ? '<br>退票原因：' + escHtml(action.reason) : '')
                    + (isSpecial
                        ? '<br>因航班延误/取消等特殊原因申请退票，提交后进入<b>人工审核</b>（1-3个工作日），审核通过可全额退款。</div>'
                        : '<br><span style="color:var(--text-muted);">正在计算退票手续费…</span></div>')
                    + '<div class="confirm-card-actions">'
                    + '<button type="button" class="confirm-btn confirm-btn--primary" data-act="ok">确认退票</button>'
                    + '<button type="button" class="confirm-btn" data-act="cancel">取消</button>'
                    + '</div>';
                chatContainer.appendChild(card);
                card.querySelector('[data-act="ok"]').onclick = function () { refundInCard(card, action.order_no, action.refund_type); };
                card.querySelector('[data-act="cancel"]').onclick = function () { cancelConfirmCard(card, '已取消本次退票申请。'); };
                if (!isSpecial) fillRefundQuote(card, action.order_no);
            } else if (action.type === 'change_flight') {
                card.innerHTML =
                    '<div class="confirm-card-title">🔄 改签确认</div>'
                    + '<div class="confirm-card-body">订单号：<b>' + escHtml(action.order_no || '-') + '</b>'
                    + '<br>新航班：' + escHtml((action.new_flight_no || '-') + ' ' + (action.new_date || '') + ' ' + (action.new_cabin || '') + '舱')
                    + '<br>免改签费，票价差多退少补。<span style="color:var(--text-muted);">正在计算差价…</span></div>'
                    + '<div class="confirm-card-actions">'
                    + '<button type="button" class="confirm-btn confirm-btn--primary" data-act="ok">确认改签</button>'
                    + '<button type="button" class="confirm-btn" data-act="cancel">取消</button>'
                    + '</div>';
                chatContainer.appendChild(card);
                card.querySelector('[data-act="ok"]').onclick = function () { changeInCard(card, action); };
                card.querySelector('[data-act="cancel"]').onclick = function () { cancelConfirmCard(card, '已取消本次改签。'); };
                fillChangeQuote(card, action);
            } else {
                return;
            }
            updateChatEmptyVisibility();
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escHtml(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        async function fillBookingCard(card, action) {
            const body = card.querySelector('.confirm-card-body');
            try {
                const q = '?flight_no=' + encodeURIComponent(action.flight_no || '')
                    + '&flight_date=' + encodeURIComponent(action.flight_date || '')
                    + '&cabin=' + encodeURIComponent(action.cabin || '')
                    + '&passengers=' + encodeURIComponent(action.passengers || 1);
                const r = await fetch('/api/booking_quote' + q);
                const d = await r.json();
                if (!r.ok || d.error) {
                    body.innerHTML = '报价失败：' + escHtml(d.error || ('HTTP ' + r.status));
                    const okBtn = card.querySelector('[data-act="ok"]');
                    if (okBtn) okBtn.disabled = true;
                    return;
                }
                body.innerHTML =
                    '<div class="quote-row"><span class="k">航班</span><span>' + escHtml(d.airline + ' ' + d.flight_no) + '</span></div>'
                    + '<div class="quote-row"><span class="k">航线 / 日期</span><span>' + escHtml(d.route + ' · ' + d.flight_date + ' ' + (d.dep_time || '')) + '</span></div>'
                    + '<div class="quote-row"><span class="k">舱位 / 人数</span><span>' + escHtml(d.cabin + '舱 × ' + d.passengers + '人') + '</span></div>'
                    + '<div class="quote-row"><span class="k">单价</span><span>¥' + d.unit_price + '</span></div>'
                    + '<div class="quote-row"><span class="k">总价</span><span class="quote-total">¥' + d.total_amount + '</span></div>';
                card.dataset.quote = JSON.stringify(d);
            } catch (e) {
                body.textContent = '报价请求失败，请重试';
            }
        }

        async function confirmBooking(card, action) {
            const okBtn = card.querySelector('[data-act="ok"]');
            const cancelBtn = card.querySelector('[data-act="cancel"]');
            if (okBtn) { okBtn.disabled = true; okBtn.textContent = '下单中…'; }
            if (cancelBtn) cancelBtn.disabled = true;
            try {
                let quote = {};
                try { quote = JSON.parse(card.dataset.quote || '{}'); } catch (e) { }
                const r = await fetch('/api/book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        flight_no: action.flight_no, flight_date: action.flight_date,
                        cabin: action.cabin, passengers: action.passengers
                    })
                });
                const d = await r.json();
                if (!r.ok || d.error) {
                    card.querySelector('.confirm-card-body').innerHTML = '❌ 下单失败：' + escHtml(d.error || ('HTTP ' + r.status));
                    card.classList.add('confirm-card--cancelled');
                    if (okBtn) { okBtn.disabled = false; okBtn.textContent = '确认预订'; }
                    if (cancelBtn) cancelBtn.disabled = false;
                    return;
                }
                card.classList.remove('confirm-card');
                card.classList.add('confirm-card', 'confirm-card--done');
                card.querySelector('.confirm-card-body').innerHTML =
                    '✅ 订单 <b>' + escHtml(d.order_no) + '</b> 已创建（待支付），金额 <b>¥' + d.total_amount + '</b>'
                    + '（' + escHtml(d.airline + ' ' + d.flight_no + ' · ' + d.route + ' · ' + d.flight_date + ' · ' + d.cabin + '舱 × ' + d.passengers) + '）';
                card.querySelector('.confirm-card-actions').innerHTML =
                    '<button type="button" class="confirm-btn confirm-btn--primary" data-act="pay">去支付</button>';
                card.querySelector('[data-act="pay"]').onclick = function () { payInCard(card, d.order_no); };
            } catch (e) {
                if (okBtn) { okBtn.disabled = false; okBtn.textContent = '确认预订'; }
                if (cancelBtn) cancelBtn.disabled = false;
                card.querySelector('.confirm-card-body').textContent = '网络错误，请重试';
            }
        }

        async function payInCard(card, orderNo) {
            const payBtn = card.querySelector('[data-act="pay"]');
            if (payBtn) { payBtn.disabled = true; payBtn.textContent = '支付中…'; }
            try {
                const r = await fetch('/api/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_no: orderNo })
                });
                const d = await r.json();
                if (!r.ok || d.error) {
                    if (payBtn) { payBtn.disabled = false; payBtn.textContent = '去支付'; }
                    alert(d.error || '支付失败');
                    return;
                }
                card.querySelector('.confirm-card-actions').innerHTML =
                    '<span class="my-data-empty">✅ 已出票</span> '
                    + '<button type="button" class="confirm-btn confirm-btn--refund" data-act="refund">申请退票</button>';
                card.querySelector('[data-act="refund"]').onclick = function () { refundInCard(card, orderNo); };
            } catch (e) {
                if (payBtn) { payBtn.disabled = false; payBtn.textContent = '去支付'; }
            }
        }

        async function fillRefundQuote(card, orderNo) {
            const body = card.querySelector('.confirm-card-body');
            try {
                const r = await fetch('/api/refund_quote?order_no=' + encodeURIComponent(orderNo));
                const d = await r.json();
                if (!r.ok || d.error) {
                    body.innerHTML = '报价失败：' + escHtml(d.error || ('HTTP ' + r.status));
                    const okBtn = card.querySelector('[data-act="ok"]');
                    if (okBtn) okBtn.disabled = true;
                    return;
                }
                body.insertAdjacentHTML('beforeend',
                    '<div class="quote-row"><span class="k">票面金额</span><span>¥' + d.amount + '</span></div>'
                    + '<div class="quote-row"><span class="k">手续费（' + escHtml(d.fee_tier) + '）</span><span>-¥' + d.fee + '</span></div>'
                    + '<div class="quote-row"><span class="k">预计到账</span><span class="quote-total">¥' + d.predict_amount + '</span></div>');
            } catch (e) {
                body.insertAdjacentHTML('beforeend', '<div style="color:var(--text-muted);">手续费计算失败，请取消后重试</div>');
                const okBtn = card.querySelector('[data-act="ok"]');
                if (okBtn) okBtn.disabled = true;
            }
        }

                    + '&new_cabin=' + encodeURIComponent(action.new_cabin || '');

                const d = await r.json();

                    + '<div class="quote-row"><span class="k">新航班</span><span>' + escHtml(d.new.airline + d.new.flight_no + ' · ' + d.new.date + ' ' + d.new.dep_time + ' · ' + d.new.cabin + '舱') + '</span></div>'

        async function changeInCard(card, action) {
            const okBtn = card.querySelector('[data-act="ok"]');
            if (okBtn) { okBtn.disabled = true; okBtn.textContent = '改签中…'; }
            try {
                const r = await fetch('/api/change', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        order_no: action.order_no, new_flight_no: action.new_flight_no,
                        new_date: action.new_date, new_cabin: action.new_cabin
                    })
                });
                const d = await r.json();
                if (!r.ok || d.error) {
                    card.querySelector('.confirm-card-body').innerHTML += '<br>❌ ' + escHtml(d.error || '改签失败');
                    if (okBtn) { okBtn.disabled = false; okBtn.textContent = '确认改签'; }
                    return;
                }
                card.classList.add('confirm-card--done');
                card.querySelector('.confirm-card-actions').innerHTML =
                    '<span class="my-data-empty">✅ 已改签至 ' + escHtml(d.new.airline + d.new.flight_no
                        + ' ' + d.new.date + ' ' + d.new.dep_time) + '，'
                    + (d.fare_diff > 0 ? '补差价 ¥' + d.fare_diff : (d.fare_diff < 0 ? '退差价 ¥' + (-d.fare_diff) : '无差价')) + '</span>';
            } catch (e) {
                if (okBtn) { okBtn.disabled = false; okBtn.textContent = '确认改签'; }
                card.querySelector('.confirm-card-body').textContent = '网络错误，请重试';
            }
        }

        async function refundInCard(card, orderNo, refundType) {
            const isSpecial = refundType === 'special';
            const okBtn = card.querySelector('[data-act="ok"]');
            const refundBtn = card.querySelector('[data-act="refund"]');
            if (okBtn) { okBtn.disabled = true; okBtn.textContent = '提交中…'; }
            if (refundBtn) { refundBtn.disabled = true; refundBtn.textContent = '提交中…'; }
            try {
                const r = await fetch('/api/refund', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_no: orderNo, refund_type: refundType || 'voluntary' })
                });
                const d = await r.json();
                if (!r.ok || d.error) {
                    card.querySelector('.confirm-card-body').innerHTML += '<br>❌ ' + escHtml(d.error || '退票失败');
                    if (okBtn) { okBtn.disabled = false; okBtn.textContent = '确认退票'; }
                    if (refundBtn) { refundBtn.disabled = false; refundBtn.textContent = '申请退票'; }
                    return;
                }
                if (d.status === '已退款') {
                    card.querySelector('.confirm-card-actions').innerHTML =
                        '<span class="my-data-empty">✅ 退票成功：已退款 ¥' + d.refund_amount
                        + '（手续费 ¥' + d.fee + '），即时到账</span>';
                } else {
                    card.querySelector('.confirm-card-actions').innerHTML =
                        '<span class="my-data-empty">✅ 特殊退票申请已提交（退票中），人工审核 1-3 个工作日</span>';
                }
            } catch (e) {
                if (okBtn) { okBtn.disabled = false; okBtn.textContent = '确认退票'; }
            }
        }

        function cancelConfirmCard(card, text) {
            card.classList.add('confirm-card--cancelled');
            card.querySelector('.confirm-card-body').innerHTML = escHtml(text || '已取消');
        }

        function toggleMyData(open) {
            const modal = document.getElementById('myDataModal');
            if (open) {
                if (!currentMember) { showLogin(); return; }
                modal.hidden = false;
                refreshMyData();
            } else {

        async function refreshMyData() {
            const ordersBox = document.getElementById('myOrdersBox');
            const compBox = document.getElementById('myComplaintsBox');
            const notifyBox = document.getElementById('myNotificationsBox');
            ordersBox.innerHTML = '<div class="my-data-empty">加载中…</div>';
            compBox.innerHTML = '<div class="my-data-empty">加载中…</div>';
            notifyBox.innerHTML = '<div class="my-data-empty">加载中…</div>';
            try {
                const results = await Promise.all([
                    fetch('/api/my/orders').then(function (r) { return r.json(); }),
                    fetch('/api/my/complaints').then(function (r) { return r.json(); }),
                    fetch('/api/my/notifications').then(function (r) { return r.json(); })
                ]);
                renderMyOrders(ordersBox, results[0]);
                renderMyComplaints(compBox, results[1]);
                renderMyNotifications(notifyBox, results[2]);
                updateUnreadDot(results[2] && results[2].unread_count);
            } catch (e) {
                ordersBox.innerHTML = '<div class="my-data-empty">加载失败，请点刷新重试</div>';
                compBox.innerHTML = '<div class="my-data-empty">加载失败，请点刷新重试</div>';
                notifyBox.innerHTML = '<div class="my-data-empty">加载失败，请点刷新重试</div>';
            }
        }

        function renderMyNotifications(box, data) {
            const actions = document.getElementById('notifyActions');
            if (data.error) {
                box.innerHTML = '<div class="my-data-empty">' + escHtml(data.error) + '</div>';
                if (actions) actions.style.display = 'none';
                return;
            }
            const list = data.notifications || [];
            if (actions) actions.style.display = list.length ? 'flex' : 'none';
            if (!list.length) { box.innerHTML = '<div class="my-data-empty">暂无通知</div>'; return; }
            const wrap = document.createElement('div');
            wrap.className = 'notify-list';
            list.forEach(function (n) {
                const item = document.createElement('div');
                item.className = 'notify-item' + (n.is_read ? '' : ' unread');
                const head = document.createElement('div');
                head.className = 'notify-item-head';
                const title = document.createElement('span');
                title.className = 'notify-item-title';
                title.textContent = (n.is_read ? '' : '🔴 ') + (n.title || '服务通知');
                const time = document.createElement('span');
                time.className = 'notify-item-time';
                time.textContent = n.created_at || '';
                head.appendChild(title); head.appendChild(time);
                const body = document.createElement('div');
                body.className = 'notify-item-content';
                body.textContent = n.content || '';
                item.appendChild(head); item.appendChild(body);
                wrap.appendChild(item);
            });
            box.innerHTML = '';
            box.appendChild(wrap);
        }

        async function markNotificationsRead() {
            try {
                await fetch('/api/my/notifications/read', { method: 'POST' });
            } catch (e) { /* 忽略网络错误，刷新时会重新拉取 */ }
            refreshMyData();
        }

        async function updateUnreadDot(count) {
            const dot = document.getElementById('unreadDot');
            if (!dot) return;
            if (count === undefined || count === null) {
                try {
                    const r = await fetch('/api/my/notifications');
                    const d = await r.json();
                    count = (d && d.unread_count) || 0;
                } catch (e) { count = 0; }
            }
            const n = Number(count) || 0;
            dot.style.display = n > 0 ? 'block' : 'none';
            dot.textContent = n > 99 ? '99+' : String(n);
        }

        function statusClass(status) {
            if (status === '待支付') return 'st-pending';
            if (status === '已出票' || status === '已改签') return 'st-ok';
            if (status === '退票中' || status === '已退款') return 'st-refund';
            if (status === '已取消') return 'st-cancelled';
            return '';
        }

        function renderMyOrders(box, data) {
            if (data.error) { box.innerHTML = '<div class="my-data-empty">' + escHtml(data.error) + '</div>'; return; }
            const orders = data.orders || [];
            if (!orders.length) { box.innerHTML = '<div class="my-data-empty">暂无订单，快去和客服订一张机票吧～</div>'; return; }

            const table = document.createElement('table');
            table.className = 'my-data-table';
            table.innerHTML = '<thead><tr><th>订单号</th><th>航班</th><th>航线</th><th>日期</th>'
                + '<th>舱位</th><th>金额</th><th>状态</th><th>操作</th></tr></thead>';
            const tbody = document.createElement('tbody');
            orders.forEach(function (o) {
                const tr = document.createElement('tr');
                const tdOps = document.createElement('td');
                if (o.status === '待支付') {
                    const payBtn = document.createElement('button');
                    payBtn.type = 'button'; payBtn.className = 'my-row-btn'; payBtn.textContent = '支付';
                    payBtn.onclick = function () { panelOrderAction(o.order_no, 'pay'); };
                    tdOps.appendChild(payBtn);
                } else if (o.status === '已出票' || o.status === '已改签') {
                    const rfBtn = document.createElement('button');
                    rfBtn.type = 'button'; rfBtn.className = 'my-row-btn my-row-btn--danger'; rfBtn.textContent = '退票';
                    rfBtn.onclick = function () { panelOrderAction(o.order_no, 'refund'); };
                    tdOps.appendChild(rfBtn);
                } else {
                    tdOps.textContent = '—';
                }
                [o.order_no, o.flight, o.route, o.flight_date, o.cabin, '¥' + o.amount].forEach(function (v) {
                    const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
                });
                const tdSt = document.createElement('td');
                tdSt.className = statusClass(o.status); tdSt.textContent = o.status;
                tr.appendChild(tdSt);
                tr.appendChild(tdOps);
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            box.innerHTML = '';
            box.appendChild(table);
        }

        function renderMyComplaints(box, data) {
            if (data.error) { box.innerHTML = '<div class="my-data-empty">' + escHtml(data.error) + '</div>'; return; }
            const list = data.complaints || [];
            if (!list.length) { box.innerHTML = '<div class="my-data-empty">暂无投诉记录</div>'; return; }

            const table = document.createElement('table');
            table.className = 'my-data-table';
            table.innerHTML = '<thead><tr><th>投诉单号</th><th>内容</th><th>状态</th><th>登记日期</th></tr></thead>';
            const tbody = document.createElement('tbody');
            list.forEach(function (c) {
                const tr = document.createElement('tr');
                [c.ticket_no, c.content, ''].forEach(function (v) {
                    const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
                });
                const tdSt = document.createElement('td');
                tdSt.className = statusClass(c.status); tdSt.textContent = c.status;
                tr.appendChild(tdSt);
                const tdDate = document.createElement('td'); tdDate.textContent = c.created_at || ''; tr.appendChild(tdDate);
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            box.innerHTML = '';
            box.appendChild(table);
        }

        async function panelOrderAction(orderNo, act) {
            const url = act === 'pay' ? '/api/pay' : '/api/refund';
            const body = act === 'pay' ? { order_no: orderNo } : { order_no: orderNo, refund_type: 'voluntary' };
            try {
                const r = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const d = await r.json();
                if (!r.ok || d.error) { alert(d.error || '操作失败'); }
                else if (act === 'refund') { toast('退票成功：已退款 ¥' + d.refund_amount + '（手续费 ¥' + d.fee + '）'); }
                refreshMyData();
            } catch (e) {
                alert('网络错误，请重试');
            }
        }

        /** 流式结束后：Markdown 渲染最终文本；无气泡时补整条消息 */
        function finishStreamBubble(assistantEl, text) {
            if (!assistantEl) {
                if (text) addMessage('assistant', text);
                return;
            }
            const body = assistantEl.querySelector('.message-body');
            if (!body) return;
            renderStreamBody(body, text || '');
        }

        /** 渲染流式文本（流式期间纯文本，最终一次走 Markdown） */
        function renderStreamBody(bodyEl, text) {
            if (canUseMarkdownPipeline()) {
                try {
                    bodyEl.innerHTML = DOMPurify.sanitize(
                        marked.parse(text, { breaks: false, gfm: true })
                    );
                    return;
                } catch (e) { /* 回退纯文本 */ }
            }
            bodyEl.textContent = text;
        }

        /** 非流式回退：POST /api/chat（原逻辑保留） */
        async function postChatSync(message) {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: message,
                    session_id: currentSessionId
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const data = await response.json();

            if (data.error) {
                addMessage('assistant', '抱歉，系统出现错误：' + data.error);
                console.error('聊天API错误:', data.error);
            } else if (data.response) {
                if (data.session_id && data.session_id !== currentSessionId) {
                    currentSessionId = data.session_id;
                }
                addMessage('assistant', data.response);
                // 插在「本条」助手气泡内；勿在 addMessage 之前选取 :last-child，否则会误插在上一轮回复上造成「两条回复」观感
                if (data.agent || data.query_type) {
                    var agentInfo = document.createElement('div');
                    agentInfo.className = 'agent-info';
                    agentInfo.textContent =
                        '🤖 ' + (data.agent || '智能客服')
                        + ' | 📋 ' + (data.query_type || '已处理');

                    var lastAssistantContent = document.querySelector(
                        '.message.assistant:last-child .message-content'
                    );
                    if (lastAssistantContent) {
                        lastAssistantContent.insertBefore(agentInfo, lastAssistantContent.firstChild);
                    }
                }
            } else {
                addMessage('assistant', '抱歉，系统返回了空响应，请稍后重试。');
                console.warn('聊天API返回空响应:', data);
            }
        }

        function copyPlainTextToClipboard(text) {
            var t = text == null ? '' : String(text);
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(t);
            }
            return new Promise(function (resolve, reject) {
                try {
                    var ta = document.createElement('textarea');
                    ta.value = t;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.left = '-9999px';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    resolve();
                } catch (err) {
                    reject(err);
                }
            });
        }

        function getMessageBodyText(messageRoot) {
            var body = messageRoot.querySelector('.message-body');
            if (!body) return '';
            return (body.innerText || body.textContent || '').trim();
        }

        function buildMessageActionsBar(messageRoot) {
            var bar = document.createElement('div');
            bar.className = 'message-actions';
            bar.setAttribute('role', 'toolbar');
            bar.setAttribute('aria-label', '复制消息');

            function iconBtn(title, ariaLabel, paths) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'msg-action-btn';
                b.title = title;
                b.setAttribute('aria-label', ariaLabel);
                b.innerHTML =
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
                return b;
            }

            var copyPaths = '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>';

            var btnCopy = iconBtn('复制', '复制全文', copyPaths);

            btnCopy.addEventListener('click', function (e) {
                e.stopPropagation();
                var txt = getMessageBodyText(messageRoot);
                if (!txt) return;
                copyPlainTextToClipboard(txt).then(function () {
                    var prev = btnCopy.title;
                    btnCopy.title = '已复制';
                    setTimeout(function () { btnCopy.title = prev; }, 1600);
                }).catch(function () {
                    btnCopy.title = '复制失败';
                    setTimeout(function () { btnCopy.title = '复制'; }, 1600);
                });
            });

            bar.appendChild(btnCopy);
            return bar;
        }

        function insertMessageActionsBeforeMeta(scopeContainer, messageRoot) {
            var meta = scopeContainer.querySelector('.message-meta');
            if (!meta) return;
            scopeContainer.insertBefore(buildMessageActionsBar(messageRoot), meta);
        }

        // 添加消息到界面
        function addMessage(role, content, tsOpt) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            attachMessageBody(contentDiv, content, role === 'assistant');

            if (role === 'user') {
                const wrap = document.createElement('div');
                wrap.className = 'message-user-wrap';
                wrap.appendChild(contentDiv);
                attachMessageMeta(wrap, '您', tsOpt);
                insertMessageActionsBeforeMeta(wrap, messageDiv);
                messageDiv.appendChild(wrap);
            } else {
                attachMessageMeta(contentDiv, '智能客服', tsOpt);
                insertMessageActionsBeforeMeta(contentDiv, messageDiv);
                messageDiv.appendChild(contentDiv);
            }

            chatContainer.appendChild(messageDiv);
            updateChatEmptyVisibility();

            // 滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 添加系统消息
        function addSystemMessage(content, tsOpt) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            attachMessageBody(contentDiv, content, true);
            attachMessageMeta(contentDiv, '系统消息', tsOpt);
            insertMessageActionsBeforeMeta(contentDiv, messageDiv);

            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            updateChatEmptyVisibility();

            // 滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 清空聊天容器
        function clearChatContainer() {
            document.getElementById('chatContainer').innerHTML = '';
            updateChatEmptyVisibility();
        }

        // 显示输入指示器
        function showTypingIndicator() {
            document.getElementById('typingIndicator').style.display = 'block';
            document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
        }

        // 隐藏输入指示器
        function hideTypingIndicator() {
            document.getElementById('typingIndicator').style.display = 'none';
        }

        // Enter 发送；Shift+Enter 换行（多行输入框）
        document.getElementById('messageInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 测试 LangGraph API 连接
        async function testLangGraphAPI() {
            try {
                console.log('🧪 开始测试 LangGraph API...');

                const response = await fetch('/api/test');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('🧪 API 测试结果:', data);

                if (data.error) {
                    addSystemMessage('❌ API 测试失败: ' + data.error);
                } else {
                    const ok = (code) => typeof code === 'number' && code >= 200 && code < 300;
                    const status = [];
                    if (ok(data.health_check)) status.push('✅ 健康检查');
                    else status.push('❌ 健康检查');

                    if (ok(data.threads_search)) status.push('✅ 线程搜索');
                    else status.push('❌ 线程搜索');

                    if (ok(data.assistants_search)) status.push('✅ 助手搜索');
                    else status.push('❌ 助手搜索');

                    addSystemMessage(`🧪 API 测试完成: ${status.join(' | ')}`);
                }
            } catch (error) {
                console.error('🧪 API 测试失败:', error);
                addSystemMessage('❌ API 测试失败: ' + error.message);
            }
        }
    </script>
